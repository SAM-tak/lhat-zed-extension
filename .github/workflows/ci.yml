name: Check extension
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          path: extension
      - id: grammar
        run: node -e 'const fs = require("node:fs"); const text = fs.readFileSync("extension.toml", "utf8"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "rev=" + text.match(/\[grammars\.lhat\][\s\S]*?rev = "([^"]+)"/)[1] + "\n");'
      - uses: actions/checkout@v4
        with:
          repository: SAM-tak/tree-sitter-lhat
          ref: ${{ steps.grammar.outputs.rev }}
          path: tree-sitter-lhat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run generate
      - run: git -C ../tree-sitter-lhat diff --exit-code -- src lton/src
      - run: npm test
      - run: npm run check:queries
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
